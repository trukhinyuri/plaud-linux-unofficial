# Builds and tests Plaud Desktop for Linux (unofficial) against the official
# Plaud release pinned in official.json, on x86_64 and aarch64.
#
# The build and pacman jobs build the full app, which contains official
# Plaud code downloaded during the job; nothing of it is uploaded: no
# artifacts, no releases, no caches of build outputs. The installer job
# (installer.yml) builds the installer packages, which contain only this
# project's code, and uploads those as artifacts.
# The daily run also checks whether the latest official release (and,
# for information, the release candidate channel) is supported by the
# current patches, so upstream changes are noticed quickly.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint and shellcheck
        run: |
          set -eux
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck
          # rhysd/actionlint 1.7.12 (linux_amd64), pinned by SHA-256.
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck -s sh -S warning \
            packaging/launcher.sh packaging/ffmpeg.sh packaging/appimage/AppRun packaging/deb/postinst packaging/deb/postrm \
            packaging/installer/plaud-linux.in packaging/installer/plaud-linux-setup.in packaging/installer/deb/postinst \
            packaging/installer/deb/prerm packaging/installer/deb/postrm packaging/installer/arch/install.in \
            scripts/install scripts/uninstall scripts/ci/*.sh

      - name: JavaScript syntax
        run: |
          set -eu
          git ls-files '*.js' '*.mjs' | grep -v '^native/.*/deps/' | while read -r f; do node --check "$f"; done

  installer:
    uses: ./.github/workflows/installer.yml

  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson python3 pkg-config \
            libpipewire-0.3-dev libopus-dev libogg-dev libdbus-1-dev libpng-dev zlib1g-dev libx11-dev libxrandr-dev \
            pipewire pipewire-bin pipewire-pulse pulseaudio-utils wireplumber dbus dbus-bin \
            ffmpeg squashfs-tools rpm appstream desktop-file-utils xdg-utils \
            xvfb xauth openbox x11-apps x11-utils libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libnotify4 libsecret-1-0

      # Only third-party downloads are cached (@electron/get keeps Electron in
      # ~/.cache/electron); the official Plaud archive is fetched every run.
      - name: Cache downloads (Electron, native dependency sources)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            native/recorder/deps/cache
          key: downloads-${{ matrix.arch }}-${{ hashFiles('scripts/electron-checksums.json', 'native/*/scripts/build-deps.mjs') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch and verify the official release
        run: npm run fetch-official

      - name: Check the patches against the pinned release
        run: node patcher/cli.js check --resources ".cache/official/$(node -p 'require("./official.json").version')/Resources"

      - name: Build the native addons
        run: npm run build:native

      # The audio tests skip themselves when a tool they need (PipeWire,
      # WirePlumber, pipewire-pulse, pactl, pw-*, ffmpeg) is missing, the live
      # screen-capture tests without a display; here a skipped test fails the
      # job. They run in an X11 session on Xvfb with a window manager and a
      # window under the pointer.
      - name: Native addon tests
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24 -noreset'
          scripts/ci/x11-desktop.sh scripts/ci/session.sh npm run test:native -- --fail-on-skip

      - name: Unit and integration tests
        run: scripts/ci/session.sh npm test

      - name: Build the app
        run: npm run build -- --skip-native-build

      - name: Package (AppImage, deb, rpm)
        run: npm run package -- --targets appimage,deb,rpm

      - name: Validate packages
        run: |
          set -eux
          desktop-file-validate build/linux-${{ matrix.arch }}/share/applications/*.desktop
          appstreamcli validate --no-net build/linux-${{ matrix.arch }}/share/metainfo/*.xml
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'opt/plaud-linux/(plaud-linux|chrome-sandbox|resources/(app.asar|recorder_linux.node|audio_monitor_linux.node|ffmpeg))$'
          dpkg-deb --contents "$deb" | grep -E '^-rwsr-xr-x root/root .* ./opt/plaud-linux/chrome-sandbox$'
          rpm=$(ls dist/*.rpm)
          rpm -qip "$rpm"
          rpm -qlvp "$rpm" | grep -E '^-rwsr-xr-x .* /opt/plaud-linux/chrome-sandbox$'
          rpm -qp --requires "$rpm"
          appimage=$(ls dist/*.AppImage)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/AppRun"
          test -f "$RUNNER_TEMP/squashfs-root/usr/lib/plaud-linux/resources/app.asar"

      - name: Install the deb and start it
        run: |
          set -eux
          sudo apt-get install -y "./$(ls dist/*.deb)"
          test -u /opt/plaud-linux/chrome-sandbox
          mkdir -p ~/.config
          echo --disable-gpu > ~/.config/plaud-linux-flags.conf
          xvfb-run -a -s '-screen 0 1920x1080x24' scripts/ci/session.sh node scripts/smoke-test.js --launcher /usr/bin/plaud-linux --timeout 120

      - name: Start the AppImage
        run: |
          set -eux
          rm -rf ~/.config/Plaud
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a -s '-screen 0 1920x1080x24' scripts/ci/session.sh node scripts/smoke-test.js --launcher "$(ls "$PWD"/dist/*.AppImage)" --timeout 120

      - name: Check the latest official release (scheduled runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          resources=$(node scripts/fetch-official.js --latest)
          node patcher/cli.js check --resources "$resources"

      # Informational: the release candidate channel shows the next major
      # release before users get it (4.0.0-rc.2 restructured the bundle).
      - name: Check the release candidate channel (scheduled runs, informational)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set -eu
          resources=$(node scripts/fetch-official.js --channel rc)
          if node patcher/cli.js check --resources "$resources"; then
            echo "### Release candidate $(basename "$(dirname "$resources")"): patches apply" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release candidate $(basename "$(dirname "$resources")"): patches need rework (docs/patches.md)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  pacman:
    name: pacman package (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git nodejs npm cmake ninja meson python pkgconf \
            libpipewire opus libogg dbus libpng zlib libx11 libxrandr pipewire wireplumber ffmpeg desktop-file-utils
          useradd -m builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and package as an unprivileged user
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          # Expanded by the builder's shell, which inherits GITHUB_WORKSPACE.
          # shellcheck disable=SC2016
          su builder -c 'cd "$GITHUB_WORKSPACE" && npm ci && npm run fetch-official && npm run build && npm run package -- --targets pacman'

      - name: Validate the package
        run: |
          set -eux
          pkg=$(ls dist/*.pkg.tar.zst)
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg" | grep -E '/opt/plaud-linux/resources/(app.asar|recorder_linux.node|audio_monitor_linux.node)$'
          bsdtar -tvf "$pkg" | grep -E '^-rwsr-xr-x .* opt/plaud-linux/chrome-sandbox$'
          pacman -U --noconfirm "$pkg"
          test -x /usr/bin/plaud-linux
